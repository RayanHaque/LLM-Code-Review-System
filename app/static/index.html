<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>LLM Code Reviewer</title>
<style>body{font:16px system-ui;max-width:900px;margin:45px auto;padding:0 18px;color:#172033;background:#f5f7fa}textarea{box-sizing:border-box;width:100%;height:260px;padding:14px;font:14px monospace}select,button{padding:10px;margin:10px 0}button{background:#174da6;color:white;border:0;border-radius:6px;cursor:pointer}pre{white-space:pre-wrap;background:white;padding:18px;border:1px solid #ddd;border-radius:8px}label{font-weight:bold}</style></head><body>
<h1>LLM Code Review System</h1><p>Paste code, select a language and request a review. Without a Gemini API key, the backend clearly returns a demo analysis.</p>
<label for="language">Language</label> <select id="language"><option>Python</option><option>JavaScript</option><option>Java</option><option>C</option><option>SQL</option></select>
<textarea id="code" aria-label="Code to review" placeholder="Paste code here..."></textarea><button id="submit">Review Code</button><h2>Result</h2><pre id="output">No review yet</pre>
<script>document.getElementById('submit').onclick=async()=>{const out=document.getElementById('output');out.textContent='Analyzing...';try{const r=await fetch('/api/reviews',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({language:document.getElementById('language').value,code:document.getElementById('code').value})});const data=await r.json();out.textContent=JSON.stringify(data,null,2)}catch(e){out.textContent='Request failed: '+String(e)}}</script></body></html>
